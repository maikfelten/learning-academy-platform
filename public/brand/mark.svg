    <rect x="-30" y="-30" width="60" height="60" stroke-width="8" opacity="0.9" />
    <rect x="-56" y="-56" width="112" height="112" stroke-width="8" opacity="0.7" />
    <rect x="-82" y="-82" width="164" height="164" stroke-width="8" opacity="0.5" />
  </g>
</svg>
